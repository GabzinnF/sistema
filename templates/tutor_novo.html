{% extends 'base.html' %}

{% block conteudo %}
<h2>Novo Tutor</h2>

<form method="POST" action="{{ url_for('tutor_novo')}}">

    <label>Nome:</label>
    <input type="text" name="nome" required>

    <label>Telefone:</label>
    <input type="text" name="telefone" required>

    <label>CPF:</label>
    <input type="text" name="cpf" required>

    <button type="submit">Salvar</button>

</form>


{% endblock %}
