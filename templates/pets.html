{% extends 'base.html' %}

{% block conteudo %}

<h2>Pets cadastrados</h2>

<form method="POST" action="{{ url_for('pet') }}" >
            <input type="text" name="busca"  placeholder="Buscar por placa..." value="{{ busca }}">
            <button type="submit">Buscar</button>
            <a href="{{url_for('pet')}}" >Limpar</a>
        </form>
<br>
<a href="{{ url_for('pet_novo') }}">
    Novo Carro
</a>

<table >

    <tr>
        <th>ID</th>
        <th>Raça</th>
        <th>Especie</th>
        <th>Data de Nascimento</th>
        <th>Tutor</th>

    </tr>

    {% for p in pets %}
    <tr>
        <td>{{ p.id }}</td>
        <td>{{ p.raca }}</td>
        <td>{{ p.especie }}</td>
        <td>{{ p.data_nascimento}}</td>
        <td>{{ p.tutor_join.nome }}</td>

    </tr>
    {% endfor %}

</table>

{% endblock %}
